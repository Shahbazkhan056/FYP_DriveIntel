buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Make bundled Maven artifacts from node_modules packages available to ALL
// subprojects (including :app). This is the Gradle 8+ compatible way to do it.
allprojects {
    repositories {
        // async-storage v3 ships storage-android locally instead of on Maven Central
        maven { url "${rootDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
    }
}

apply plugin: "com.facebook.react.rootproject"
